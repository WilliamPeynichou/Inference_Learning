<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Recorded turn errors by model</title>
<desc id="desc">Descriptive comparison of recorded turn errors by common model. Tasks are unpaired and causes may differ.</desc>
