<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img" aria-labelledby="title desc">
<title id="title">From observation to reuse</title>
<desc id="desc">The game grid is represented as Python objects. Breadth-first search uses retained objects and functions. The runner confirms moves. Transfer remains untested.</desc>
<style>
  text{font-family:system-ui,sans-serif;fill:#182637}
  .title{font-family:Georgia,serif;font-size:32px;font-weight:700}
  .body{font-size:16px}.note{font-size:14px;fill:#405266}
  .meta{font-size:13px;letter-spacing:1.4px;font-weight:700;fill:#345577}
  .strong{font-size:16px;font-weight:700}.light{font-size:16px;font-weight:700;fill:white}
</style>
<rect width="960" height="382" fill="#fff"/>
<text x="48" y="40" class="meta" text-anchor="start">FIGURE 02    /    CONCEPTUAL DIAGRAM</text>
<text x="48" y="82" class="title" text-anchor="start">From observation to reuse</text>
<path d="M48 105L912 105" fill="none" stroke="#8695a4"/>
<text x="48" y="138" class="note" text-anchor="start">Interpretive diagram of the ls20 pilot, not a performance measure.</text>
<rect x="48" y="173" width="204" height="87" fill="#f3f6f9" stroke="#aebcca"/>
<text x="62" y="204" class="strong" text-anchor="start">Observation</text>
<text x="62" y="234" class="note" text-anchor="start">Game grids</text>
<text x="260" y="220" class="strong" text-anchor="middle">→</text>
<rect x="268" y="173" width="204" height="87" fill="#f3f6f9" stroke="#aebcca"/>
<text x="282" y="204" class="strong" text-anchor="start">Python state</text>
<text x="282" y="234" class="note" text-anchor="start">Objects and functions</text>
<text x="480" y="220" class="strong" text-anchor="middle">→</text>
<rect x="488" y="173" width="204" height="87" fill="#f3f6f9" stroke="#aebcca"/>
<text x="502" y="204" class="strong" text-anchor="start">Computation</text>
<text x="502" y="234" class="note" text-anchor="start">Breadth-first search</text>
<text x="700" y="220" class="strong" text-anchor="middle">→</text>
<rect x="708" y="173" width="204" height="87" fill="#f3f6f9" stroke="#aebcca"/>
<text x="722" y="204" class="strong" text-anchor="start">Verification</text>
<text x="722" y="234" class="note" text-anchor="start">Confirmed moves</text>
<text x="48" y="298" class="body" text-anchor="start">Reuse: retained grids and functions support path recalculation.</text>
<text x="48" y="327" class="note" text-anchor="start">To test: reconstruction savings and transfer to an unseen game.</text>
<text x="48" y="354" class="note" text-anchor="start">Source: pilot report. No weight update or causal effect established.</text>
</svg>
