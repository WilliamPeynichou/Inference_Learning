<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" aria-labelledby="title desc">
<title id="title">Three observations to test against traces</title>
<desc id="desc">Qualitative hypotheses about cold and warm turns, tokens and cache, and provider limits. No quantified results.</desc>
<style>
  text{font-family:system-ui,sans-serif;fill:#182637}
  .title{font-family:Georgia,serif;font-size:32px;font-weight:700}
  .body{font-size:16px}.note{font-size:14px;fill:#405266}
  .meta{font-size:13px;letter-spacing:1.4px;font-weight:700;fill:#345577}
  .strong{font-size:16px;font-weight:700}.light{font-size:16px;font-weight:700;fill:white}
</style>
<rect width="960" height="462" fill="#fff"/>
<text x="48" y="40" class="meta" text-anchor="start">FIGURE 03    /    MEASUREMENT PLAN</text>
<text x="48" y="82" class="title" text-anchor="start">Three observations to test against traces</text>
<path d="M48 105L912 105" fill="none" stroke="#8695a4"/>
<text x="48" y="139" class="meta" text-anchor="start">Reported observation</text>
<text x="492" y="139" class="meta" text-anchor="start">Proposed measure</text>
<path d="M472 121L472 403" fill="none" stroke="#c9d0d7"/>
<path d="M48 158L912 158" fill="none" stroke="#c9d0d7"/>
<text x="48" y="179" class="strong" text-anchor="start">Turns and reuse</text>
<text x="48" y="202" class="note" text-anchor="start">Longer perceived cold-start workflow,</text>
<text x="48" y="222" class="note" text-anchor="start">then shorter as Compute is used.</text>
<text x="492" y="190" class="body" text-anchor="start">Calls, time, and objects reused</text>
<text x="492" y="213" class="body" text-anchor="start">per validated task at comparable quality.</text>
<path d="M48 237L912 237" fill="none" stroke="#c9d0d7"/>
<text x="48" y="258" class="strong" text-anchor="start">Tokens and cache</text>
<text x="48" y="281" class="note" text-anchor="start">Little visible output; input appears</text>
<text x="48" y="301" class="note" text-anchor="start">dominant. Python output role is unknown.</text>
<text x="492" y="269" class="body" text-anchor="start">Separate input, output, reasoning,</text>
<text x="492" y="292" class="body" text-anchor="start">provider cache, and Python outputs sent.</text>
<path d="M48 316L912 316" fill="none" stroke="#c9d0d7"/>
<text x="48" y="337" class="strong" text-anchor="start">Provider limits</text>
<text x="48" y="360" class="note" text-anchor="start">Limits perceived later on Opus 5.5,</text>
<text x="48" y="380" class="note" text-anchor="start">Fable 5.2, and 6.2 Sol.</text>
<text x="492" y="348" class="body" text-anchor="start">Work before blocking and resumption time,</text>
<text x="492" y="371" class="body" text-anchor="start">by model and quota window.</text>
<path d="M48 403L912 403" fill="none" stroke="#c9d0d7"/>
<text x="48" y="433" class="note" text-anchor="start">Source: unquantified user observations, separate from pilot results.</text>
</svg>
